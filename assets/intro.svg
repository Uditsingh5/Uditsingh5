  <text x="60" y="130" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="2" fill="#CCFF00">NOTE.001 &#8212; MANIFESTO</text>
<text x="60" y="176" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#F5F5F0">I engineer inevitabilities, not just products.</text>
<text x="60" y="206" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#F5F5F0">Every interface gets stress-tested against one</text>
<text x="60" y="236" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#F5F5F0">rule: if it isn't obvious in hindsight, it isn't</text>
<text x="60" y="266" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#F5F5F0">finished &#8212; so it doesn't ship.</text>
<text x="60" y="310" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#F5F5F0">React on the surface. Node underneath.</text>
<text x="60" y="340" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#CCFF00">Opinions all the way down.</text>
